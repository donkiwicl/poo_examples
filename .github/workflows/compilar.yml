name: Compilar

# Compila cada caso en cada push y pull request.
# - En main (codigo inicial) solo se compila: las pruebas de autoevaluacion
#   fallan a proposito hasta que el estudiante resuelve el caso.
# - En la rama solucion se ejecuta mvn verify: compila y corre las pruebas.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  compilar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        caso:
          - puntuales/01-herencia
          - puntuales/02-polimorfismo
          - puntuales/03-excepciones
          - puntuales/04-maven
          - puntuales/05-javafx-escenas
          - puntuales/06-fxml-eventos
          - puntuales/07-javafx-imagenes
          - puntuales/08-tableview
          - puntuales/09-navegacion
          - puntuales/10-persistencia-json
          - completos/01-arriendo-bicicletas
          - completos/02-biblioteca
    name: ${{ matrix.caso }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar
        working-directory: ${{ matrix.caso }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "solucion" ] || [ "${GITHUB_BASE_REF}" = "solucion" ]; then
            mvn -B verify
          else
            mvn -B compile
          fi
